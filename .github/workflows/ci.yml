name: CI Matrix (Cross-Platform)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vette core CLI
        run: npm run build

      - name: Verify Vette CLI execution
        run: node dist/cli.js --version

      - name: Test Vetting known safe package (react)
        run: node dist/cli.js vet react

      - name: Test Vetting PyPI package (requests)
        run: node dist/cli.js vet requests -r pypi

      - name: Test scanning project dependencies
        run: node dist/cli.js scan package.json

      - name: Test GitHub Action runner
        run: node dist/cli.js action

      - name: Build IDE Extension
        run: |
          cd extension
          npm ci
          npm run build
